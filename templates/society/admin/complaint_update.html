{% extends 'society/base.html' %}

{% block title %}Update Complaint | Smart Society Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 fw-bold mb-2">Update Complaint #{{ complaint.id }}</h1>
                <p class="text-muted mb-4">{{ complaint.resident.full_name }} - {{ complaint.title }}</p>
                <form method="post" class="vstack gap-3">
                    {% csrf_token %}
                    <div>
                        <label class="form-label fw-semibold">Complaint Status</label>
                        {{ form.status }}
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-primary" type="submit">Save Status</button>
                        <a class="btn btn-outline-secondary" href="{% url 'admin-complaints' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
